name: Thrower (build)

# Treti hra zije na SVE vetvi jednoho repozitare (vetev = hra). Workflow se
# spousti jen na ni a publikuje do sveho podadresare na gh-pages, aby
# neprepsala Zily 2 ani stary ley-lines.
on:
  push:
    branches: ["thrower"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot editor + export templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          python3 -c "import zipfile; zipfile.ZipFile('godot.zip').extractall('.')"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O tpl.tpz
          python3 -c "import zipfile; zipfile.ZipFile('tpl.tpz').extractall('.')"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          cp -r templates/. "$DEST"/
          ./godot --headless --version

      - name: Import assets
        run: ./godot --headless --path . --import

      # KONTROLA OPACNYM SMEREM: co obrazovka vola na `game`/`layout`/`menu`,
      # musi na tech objektech opravdu byt. GDScript takovou chybu jen ohlasí
      # a funkci prerusí - obrazovka se pak v tom miste vubec nedokresli.
      - name: Symbols exist (view vs game)
        run: python3 tools/check_symbols.py .

      - name: Every script loads
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_scripts_load.gd 2>&1)
          echo "$OUT" | tail -20
          echo "$OUT" | grep -q "SCRIPTS_ALL_PASS=true"

      # HERNI PRAVIDLA: ostep leti OPAČNYM smerem, nez ukazuje prst; haze se
      # jen kdyz hrac drzi prst; zasah ubira zivoty a odraz preskakuje.
      - name: Game rules test
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_core.gd 2>&1)
          echo "$OUT" | tail -30
          echo "$OUT" | grep -q "CORE_ALL_PASS=true"

      - name: Upgrades test
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_upgrades.gd 2>&1)
          echo "$OUT" | tail -30
          echo "$OUT" | grep -q "UPGRADES_ALL_PASS=true"

      - name: Layout test
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_layout.gd 2>&1)
          echo "$OUT" | tail -30
          echo "$OUT" | grep -q "LAYOUT_ALL_PASS=true"

      - name: Export web build
        run: |
          set -e
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" || true
          ls -la build/web

      - name: Fix PWA export (manifest + service worker + orientace)
        run: python3 tools/fix_pwa_export.py build/web "${GITHUB_SHA:0:7}"

      - name: Service worker must be valid JavaScript
        run: node --check build/web/index.service.worker.js

      - name: Build stamp
        run: printf '%s' "${GITHUB_SHA:0:7}" > build/web/version.txt

      - name: Assert the expected artifacts exist
        run: |
          set -e
          MISSING=0
          for f in build/web/index.html build/web/index.wasm build/web/index.pck \
                   build/web/index.manifest.json build/web/index.service.worker.js \
                   build/web/index.192x192.png build/web/version.txt; do
            if [ -f "$f" ]; then echo "OK   $(du -h "$f" | cut -f1)  $f";
            else echo "MISS ---  $f"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then echo "ARTIFACTS_ALL_PRESENT=false"; exit 1; fi
          echo "ARTIFACTS_ALL_PRESENT=true"

      - name: Publish to GitHub Pages (subfolder, keeps other games)
        if: hashFiles('build/web/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          destination_dir: thrower
          keep_files: true
