name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# peaceiris/actions-gh-pages and action-gh-release both WRITE to the repo.
# Without this, GITHUB_TOKEN is read-only on repos with restrictive defaults
# and both steps fail with 403.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK + Android SDK are preinstalled on ubuntu runners; this pins the JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Godot editor + export templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          python3 -c "import zipfile; zipfile.ZipFile('godot.zip').extractall('.')"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O tpl.tpz
          python3 -c "import zipfile; zipfile.ZipFile('tpl.tpz').extractall('.')"
          # Godot looks for exactly <version>.stable/ — create it before moving.
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          cp -r templates/. "$DEST"/
          ls "$DEST" | head
          ./godot --headless --version

      # The PWA checkout is a separate repository, so the converter cannot run
      # here. What CI checks is the COMMITTED data/: the exact JSON that ships,
      # asserted for counts and spot-checked content. A truncated or empty
      # convert is the realistic failure and this is what catches it.
      - name: Verify committed data tables
        run: |
          set -e
          OUT=$(node tools/import/verify.mjs --data data 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "DATA_VERIFY_ALL_PASS=true"

      # On a CLEAN checkout Godot has no imported resources yet, so anything that
      # does load("res://assets/...png") fails.
      - name: Import assets
        run: ./godot --headless --path . --import

      # A PARSE ERROR in a script nothing has loaded yet does NOT surface in the
      # import run. This loads every .gd by its real path and takes one second.
      - name: Every script loads
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_scripts_load.gd 2>&1)
          echo "$OUT" | tail -20
          echo "$OUT" | grep -q "SCRIPT_LOAD_ALL_PASS=true"

      # The whole port rests on the JSON tables being correct, so this is the
      # first gameplay test. It asserts COUNTS, not just "no error": a converter
      # that silently drops a table is the realistic failure here.
      - name: Data tables test (items, monsters, acts, classes)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_data.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "DATA_ALL_PASS=true"

      # Itemisation is the half of the port that is pure rules: affix roll ranges,
      # level requirements, Magic Find diminishing, stacking. The test asserts real
      # rolled VALUES (1530 affix rolls checked against their ranges), because a
      # roller that returns the minimum every time passes any "no error" check.
      - name: Itemisation test (affixes, MF, loot, gems)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_items.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "ITEMS_ALL_PASS=true"

      # Equipping and the town are where the save is actually written, so this is
      # the test that catches a rule change breaking the persisted shape.
      - name: Equip and town test
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_equip_and_town.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "EQUIP_TOWN_ALL_PASS=true"

      # The combat is the part that could not be tested before the port: in the PWA
      # these numbers lived in a requestAnimationFrame loop that also moved DOM
      # nodes. This drives 15 real fights (every act x every difficulty) tick by
      # tick and asserts they END, and in a sane number of ticks - a fight that
      # never resolves is invisible to any "does it boot" check.
      - name: Combat test (scaling, pacing, progression)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_combat.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "COMBAT_ALL_PASS=true"

      # The shop, the gamble, crafting, the chest and the talent trees are all GATED
      # systems, and a gate that silently stops applying looks exactly like a working
      # feature: the screen still renders, it just offers the wrong thing. This pins
      # the gates (progress vs level, magic-only jewellery, recipe quality, tiers).
      - name: Shop, craft and talent test
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_shop_and_craft.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "SHOP_CRAFT_ALL_PASS=true"

      # Socketing is invisible when it breaks: a gem that grants the wrong stat
      # (armour's +HP on a weapon instead of fire damage) still inserts cleanly and
      # still shows an icon. Same for an occupied socket that quietly takes a second
      # gem. This pins the host-type table and both refusals.
      - name: Socketing test (gems, jewels, host-type stats)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_socketing.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "SOCKETING_ALL_PASS=true"

      - name: Export
        run: |
          set -e
          mkdir -p build/web build/windows build/android
          # Each export is allowed to return non-zero: Godot reports a FAILURE
          # when the Android signing step cannot find a release keystore and
          # still writes the unsigned APK. What must not pass silently is a
          # MISSING artifact, so the step below is the actual gate.
          ./godot --headless --path . --export-release "Web"     || true
          ./godot --headless --path . --export-release "Windows" || true
          ./godot --headless --path . --export-release "Android" || true
          ls -la build/web build/windows build/android

      # The gate for the step above. `|| true` on an export is only acceptable
      # when something later asserts the file exists — otherwise a build that
      # produced nothing at all still goes green and ships nothing.
      - name: Assert the expected artifacts exist
        run: |
          set -e
          MISSING=0
          for f in build/web/index.html build/web/index.wasm build/web/index.pck \
                   build/windows/dungeon-recall.exe build/windows/dungeon-recall.pck \
                   build/android/dungeon-recall.apk; do
            if [ -f "$f" ]; then
              echo "OK   $(du -h "$f" | cut -f1)  $f"
            else
              echo "MISS ---  $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "ARTIFACTS_ALL_PRESENT=false"
            exit 1
          fi
          echo "ARTIFACTS_ALL_PRESENT=true"

      - name: Report what actually got built
        id: built
        run: |
          {
            echo "report<<EOF"
            for f in build/web/index.html build/web/index.wasm build/windows/dungeon-recall.exe build/android/dungeon-recall.apk; do
              if [ -f "$f" ]; then echo "OK   $(du -h "$f" | cut -f1)  $f"; else echo "MISS ---  $f"; fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Publish to GitHub Pages (web build)
        if: hashFiles('build/web/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages

      - name: Attach downloads to a Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ steps.built.outputs.report }}
          files: |
            build/windows/dungeon-recall.exe
            build/android/dungeon-recall.apk
