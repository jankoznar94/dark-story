name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# peaceiris/actions-gh-pages and action-gh-release both WRITE to the repo.
# Without this, GITHUB_TOKEN is read-only on repos with restrictive defaults
# and both steps fail with 403.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK + Android SDK are preinstalled on ubuntu runners; this pins the JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch Godot editor + export templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          python3 -c "import zipfile; zipfile.ZipFile('godot.zip').extractall('.')"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O tpl.tpz
          python3 -c "import zipfile; zipfile.ZipFile('tpl.tpz').extractall('.')"
          # Godot looks for exactly <version>.stable/ — create it before moving.
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          cp -r templates/. "$DEST"/
          ls "$DEST" | head
          ./godot --headless --version

      # On a CLEAN checkout Godot has no imported resources yet, so anything that
      # does load("res://models/hero.glb") fails with
      #   "Cannot open file 'res://.godot/imported/hero.glb-....scn'"
      # Locally this is invisible because .godot/ already holds the cache. Import
      # assets explicitly before any test runs.
      - name: Import assets
        run: ./godot --headless --path . --import

      - name: Generate input map
        run: ./godot --headless --path . --script res://tools/gen_input_map.gd

      # A PARSE ERROR in a script nothing has loaded yet does NOT surface in the
      # import run (measured: six "Identifier not declared" errors, no import
      # output at all, and the first symptom was a half-built scene). This loads
      # every .gd by its real path and takes one second.
      - name: Every script loads (catches a parse error the import run hides)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_scripts_load.gd 2>&1)
          echo "$OUT" | tail -20
          echo "$OUT" | grep -q "SCRIPT_LOAD_ALL_PASS=true"

      - name: Headless gameplay test (must pass before we ship a build)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_attack.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "ALL_PASS=true"

      - name: Controls + layout test (must pass before we ship a build)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_controls.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "CONTROLS_ALL_PASS=true"

      - name: Weapon-in-hand test (must pass before we ship a build)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_weapon.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "WEAPON_ALL_PASS=true"

      - name: Locomotion retime test (walk/run feet do not slide)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_walk_retime.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "LOCOMOTION_RETIME_ALL_PASS=true"

      - name: Fight test (must pass before we ship a build)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_fight.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "FIGHT_ALL_PASS=true"

      - name: Wall-escape test (the hero must not stick to props)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_wall_escape.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "WALL_ESCAPE_ALL_PASS=true"

      - name: Auto-target test (the held attack must walk the player in)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_autotarget.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "AUTOTARGET_ALL_PASS=true"

      - name: Locomotion gait test (cadence and retime of the run and walk)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_locomotion_slide.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "LOCOMOTION_GAIT_ALL_PASS=true"

      - name: Loot + inventory test (D2 grid, slots, affixes, pickups)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_inventory.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "INVENTORY_ALL_PASS=true"

      - name: Panels + pause + bodies test (the game really stops)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_panels.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "PANELS_ALL_PASS=true"

      # Jan's reports of a corpse becoming prone instantly (the death clip was
      # frozen on the frame the monster died) and of an item not going into an
      # equip slot when he taps the item and then the box. Both are asserted as
      # NUMBERS here (the head's fall curve, the whole tap-then-tap interaction),
      # so a regression fails the build instead of reaching his phone.
      - name: Corpse fall + equip-by-tap test
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_corpse_fall_and_equip.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "CORPSE_FALL_AND_EQUIP_ALL_PASS=true"

      - name: Export
        run: |
          set -e
          mkdir -p build/web build/windows build/android
          ./godot --headless --path . --export-release "Web"     || true
          ./godot --headless --path . --export-release "Windows" || true
          ./godot --headless --path . --export-release "Android" || true
          ls -la build/web build/windows build/android

      - name: Patch web service worker (split cache, saves ~38 MB per deploy)
        run: |
          set -e
          python3 tools/patch_web_sw.py build/web
          python3 tools/test_web_cache.py | tail -10
          python3 tools/test_web_cache.py | grep -q "WEB_CACHE_ALL_PASS=true"

      - name: Report what actually got built
        id: built
        run: |
          {
            echo "report<<EOF"
            for f in build/web/index.html build/web/index.wasm build/windows/arpg.exe build/android/arpg.apk; do
              if [ -f "$f" ]; then echo "OK   $(du -h "$f" | cut -f1)  $f"; else echo "MISS ---  $f"; fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Publish to GitHub Pages (web build)
        if: hashFiles('build/web/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages

      - name: Attach downloads to a Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ steps.built.outputs.report }}
          files: |
            build/windows/arpg.exe
            build/android/arpg.apk
