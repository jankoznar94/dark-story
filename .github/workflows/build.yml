name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# peaceiris/actions-gh-pages and action-gh-release both WRITE to the repo.
# Without this, GITHUB_TOKEN is read-only on repos with restrictive defaults
# and both steps fail with 403.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK + Android SDK are preinstalled on ubuntu runners; this pins the JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Godot editor + export templates
        run: |
          set -e
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          python3 -c "import zipfile; zipfile.ZipFile('godot.zip').extractall('.')"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O tpl.tpz
          python3 -c "import zipfile; zipfile.ZipFile('tpl.tpz').extractall('.')"
          # Godot looks for exactly <version>.stable/ — create it before moving.
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          cp -r templates/. "$DEST"/
          ls "$DEST" | head
          ./godot --headless --version

      # The PWA checkout is a separate repository, so the converter cannot run
      # here. What CI checks is the COMMITTED data/: the exact JSON that ships,
      # asserted for counts and spot-checked content. A truncated or empty
      # convert is the realistic failure and this is what catches it.
      - name: Verify committed data tables
        run: |
          set -e
          OUT=$(node tools/import/verify.mjs --data data 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "DATA_VERIFY_ALL_PASS=true"

      # On a CLEAN checkout Godot has no imported resources yet, so anything that
      # does load("res://assets/...png") fails.
      - name: Import assets
        run: ./godot --headless --path . --import

      # A PARSE ERROR in a script nothing has loaded yet does NOT surface in the
      # import run. This loads every .gd by its real path and takes one second.
      - name: Every script loads
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_scripts_load.gd 2>&1)
          echo "$OUT" | tail -20
          echo "$OUT" | grep -q "SCRIPT_LOAD_ALL_PASS=true"

      # The whole port rests on the JSON tables being correct, so this is the
      # first gameplay test. It asserts COUNTS, not just "no error": a converter
      # that silently drops a table is the realistic failure here.
      #
      # It also checks that every image asset's CONTENT matches its EXTENSION. A JPEG named
      # `.png` is the way a screen silently draws nothing: Godot refuses it, the caller gets
      # `null`, and the node is still `visible` — which is exactly how the defeat page was
      # a black screen for a whole session with every test green.
      - name: Data tables test (items, monsters, acts, classes)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_data.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "DATA_ALL_PASS=true"

      # Itemisation is the half of the port that is pure rules: affix roll ranges,
      # level requirements, Magic Find diminishing, stacking. The test asserts real
      # rolled VALUES (1530 affix rolls checked against their ranges), because a
      # roller that returns the minimum every time passes any "no error" check.
      - name: Itemisation test (affixes, MF, loot, gems)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_items.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "ITEMS_ALL_PASS=true"

      # Equipping and the town are where the save is actually written, so this is
      # the test that catches a rule change breaking the persisted shape.
      - name: Equip and town test
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_equip_and_town.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "EQUIP_TOWN_ALL_PASS=true"

      # The combat is the part that could not be tested before the port: in the PWA
      # these numbers lived in a requestAnimationFrame loop that also moved DOM
      # nodes. This drives 15 real fights (every act x every difficulty) tick by
      # tick and asserts they END, and in a sane number of ticks - a fight that
      # never resolves is invisible to any "does it boot" check.
      - name: Combat test (scaling, pacing, progression)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_combat.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "COMBAT_ALL_PASS=true"

      # The shop, the gamble, crafting, the chest and the talent trees are all GATED
      # systems, and a gate that silently stops applying looks exactly like a working
      # feature: the screen still renders, it just offers the wrong thing. This pins
      # the gates (progress vs level, magic-only jewellery, recipe quality, tiers).
      - name: Shop, craft and talent test
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_shop_and_craft.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "SHOP_CRAFT_ALL_PASS=true"

      # Socketing is invisible when it breaks: a gem that grants the wrong stat
      # (armour's +HP on a weapon instead of fire damage) still inserts cleanly and
      # still shows an icon. Same for an occupied socket that quietly takes a second
      # gem. This pins the host-type table and both refusals.
      - name: Socketing test (gems, jewels, host-type stats)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_socketing.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "SOCKETING_ALL_PASS=true"

      # Jan's report: "the vertical scrollbar is visible, the page can only be scrolled with
      # it, and a normal swipe does nothing." Both halves are invisible to every other test —
      # a `ScrollContainer` only drags with a finger where Godot's own touch drag is live
      # (false in a desktop browser), and the bar is drawn unless the mode is SHOW_NEVER.
      # This pins the driver's arithmetic AND, on a real frame, that a DRAG does not fire the
      # button it started on (the player swipes the town and a shop opens).
      - name: Page scroll test (drag driver, no scrollbar, drag vs tap)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_page_scroll.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "PAGE_SCROLL_ALL_PASS=true"

      # The difficulty ladder is the one gate whose failure mode is a DEAD END, not a
      # wrong number: the town hides the Wilderness button when no act is left at the
      # current difficulty, so a ladder that never advances finishes Normal and stops
      # the game being playable at all.
      - name: Difficulty ladder test
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_difficulty.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "DIFFICULTY_ALL_PASS=true"

      # The class spells and the arena screen that casts them. Two separate gates on
      # purpose: `test_player_spells` asserts the RULES (the talent gate, cooldowns,
      # buffs that expire, mana regen that actually ticks), while `test_arena_screen`
      # asserts the WIRING — that the bar really builds a button per learned spell, that
      # tapping it reaches the rules, that the buttons survive a render tick, and that
      # the barbarian's mana bar is on screen. A bar built but never clickable passes
      # every rule test in the file.
      - name: Class spells test (gate, cooldowns, buffs, mana)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_player_spells.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "PLAYER_SPELLS_ALL_PASS=true"

      - name: Arena screen test (spell bar wiring)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_arena_screen.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "ARENA_SCREEN_ALL_PASS=true"

      # The MONSTER's side of the fight. Five of the eleven enemy spells used to be
      # unimplemented, so a caster could pick `defensive_shout` and burn its whole swing
      # on a no-op — which reads as "the monster stopped attacking", not as a missing
      # feature. The monster's own buffs are the same trap the hero's side already had:
      # a buff whose timer nobody ticks never expires.
      - name: Enemy spells test (all eleven, buffs, types, poison)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_enemy_spells.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "ENEMY_SPELLS_ALL_PASS=true"

      # The LAYOUT, which is what "the port looks like a different game" actually was.
      # The PWA's CSS is written for a 390x844 viewport and every measurement in the port
      # is relative to it; on a landscape canvas the whole port is a different screen, and
      # that regression lives in project.godot where no gameplay test would notice it.
      # The same gate covers the arena's ring stack radii, taken from the PWA's own
      # `r=` attributes — two rings landing on the same radius silently loses a gauge.
      - name: Portrait/layout test (canvas, clear colour, ring stack)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_portrait_visual.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "PORTRAIT_VISUAL_ALL_PASS=true"

      # The STRUCTURE, which is the other half of "the port looks like a different game".
      # The PWA has `inventory`/`talents`/`hero` as three TABS of one modal; the port had
      # them as three separate screens, so "the hero screen" carried the stat sheet and the
      # whole skill trees in one column — a shape the PWA never had. This asserts the modal
      # exists, that opening it hides every other screen (a dialog that opens and is painted
      # over), that the three nav keys land on three distinct panes (a strip that highlights
      # the tab you tapped while showing one pane for all of them), and that the nav bar
      # does not stay up over the dialog.
      - name: Character modal test (tabs, overlay, nav-bar suppression)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_character_modal.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "CHARACTER_MODAL_ALL_PASS=true"

      # The map's RULES, which no screenshot can pin. Every divergence on this screen was
      # invented STATE, not a wrong pixel: a stat line the PWA does not have, a "N/10
      # zastavek" sub-line, and a stop path that unrolled itself on open. Each of those
      # builds, renders and looks plausible while being wrong. This asserts that the map
      # starts collapsed, that a collapsed act contributes NO child to the act list (the
      # list's 8px separation is counted between every child, so an empty box moves the
      # next card down), that tapping toggles without writing the save, that the
      # difficulty switch collapses the path through the route its button actually takes,
      # and that the difficulty selector wires its ACTIVE button too.
      - name: Map screen test (collapsed start, difficulty reset, list children)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_map_screen.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "MAP_SCREEN_ALL_PASS=true"

      # The arena's DISTANCE rule and the class kit. The PWA starts the duel at maximum
      # separation and the hero walks in; out of his weapon's reach the swing is DISCARDED
      # and its clock restarted. Without it the port's first hit lands on tick zero, which
      # reads as "the swing timers do not work". Half of this asserts the rule, half the
      # RENDERER's projection of it (`_place_hero` endpoint positions plus a monotone walk
      # against `_gap`) — a renderer that ignores `_gap` passes two endpoint checks if it
      # happens to sit at one of them.
      - name: Duel distance test (walk-in, reach gate, class kit)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_duel_distance.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "DUEL_DISTANCE_ALL_PASS=true"

      # The arena's CLOCK and its END, driven through `_process(delta)` — the seam no other
      # test touches. `test_combat` supplies the clock itself (it ticks the battle 100 ms at
      # a time), so a screen that pumped one tick per FRAME looked perfect to it while the
      # fight actually ran at the frame rate, about 6x fast. This also pins the pack fight
      # reaching its LAST member, a defeat settling the save exactly once, and a cleared stop
      # offering the map instead of another fight forever.
      #
      # It ALSO pins the result PAGE's GEOMETRY: what "the win and lose screen do not work"
      # looked like. The port's defeat page was a black screen with two labels in the corner
      # because `result_defeat.png` shipped as a JPEG under a `.png` name — the texture was
      # `visible` and null, so no assertion above could see it. The rects are asserted, not the
      # visibility flags, and the assertion is verified by mutation (restore the JPEG, or make
      # the loot list a sibling of the expanding block, and it goes red).
      - name: Arena pacing test (real-time clock, pack end, defeat, cleared stop)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_arena_pacing.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "ARENA_PACING_ALL_PASS=true"

      # The arena's OTHER clock. `test_arena_pacing` above measures the RULES' pace and was
      # green the whole time the player was reporting "it runs at 5 FPS": `render()` ran from
      # `step()`, i.e. ten times a second, so the swing ring, the HP bar and the walk-in
      # stepped in 100 ms jumps while the engine drew 60 frames around them. Nothing was
      # slow, and no test that supplied its own clock could see it.
      #
      # So this one measures MOTION PER FRAME through the real `_process`, and it also pins
      # the other half of the split: none of the interpolation may change what the RULES
      # decide (two seconds of 60 Hz frames is still 2000 ms of fight time, ten ticks).
      - name: Arena smoothness test (per-frame motion, rules clock untouched)
        run: |
          set -e
          OUT=$(./godot --headless --path . --script res://tools/test_arena_smoothness.gd 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "ARENA_SMOOTHNESS_ALL_PASS=true"

      - name: Export
        run: |
          set -e
          mkdir -p build/web build/windows build/android
          # Each export is allowed to return non-zero: Godot reports a FAILURE
          # when the Android signing step cannot find a release keystore and
          # still writes the unsigned APK. What must not pass silently is a
          # MISSING artifact, so the step below is the actual gate.
          ./godot --headless --path . --export-release "Web"     || true
          ./godot --headless --path . --export-release "Windows" || true
          ./godot --headless --path . --export-release "Android" || true
          ls -la build/web build/windows build/android

      # The gate for the step above. `|| true` on an export is only acceptable
      # when something later asserts the file exists — otherwise a build that
      # produced nothing at all still goes green and ships nothing.
      - name: Assert the expected artifacts exist
        run: |
          set -e
          MISSING=0
          for f in build/web/index.html build/web/index.wasm build/web/index.pck \
                   build/windows/dungeon-recall.exe build/windows/dungeon-recall.pck \
                   build/android/dungeon-recall.apk; do
            if [ -f "$f" ]; then
              echo "OK   $(du -h "$f" | cut -f1)  $f"
            else
              echo "MISS ---  $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "ARTIFACTS_ALL_PRESENT=false"
            exit 1
          fi
          echo "ARTIFACTS_ALL_PRESENT=true"

      - name: Report what actually got built
        id: built
        run: |
          {
            echo "report<<EOF"
            for f in build/web/index.html build/web/index.wasm build/windows/dungeon-recall.exe build/android/dungeon-recall.apk; do
              if [ -f "$f" ]; then echo "OK   $(du -h "$f" | cut -f1)  $f"; else echo "MISS ---  $f"; fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Publish to GitHub Pages (web build)
        if: hashFiles('build/web/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages

      - name: Attach downloads to a Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ steps.built.outputs.report }}
          files: |
            build/windows/dungeon-recall.exe
            build/android/dungeon-recall.apk
